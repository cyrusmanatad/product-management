name: Deploy Production

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
  deploy:
    name: Deploy to OVH
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://bentador.cyrusmanatad.com

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add OVH host to known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy release to OVH
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9._/-]+$ ]] || exit 1
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s -- "$RELEASE_TAG" <<'EOF'
            set -euo pipefail
            umask 077
            release_tag="$1"
            cd /opt/bentador
            mkdir -p backups
            backup="backups/pre-${release_tag//\//-}-$(date -u +%Y%m%dT%H%M%SZ).dump"
            compose=(docker compose --env-file .env.prod -f docker-compose.prod.yml)

            # Close ingress before taking the consistent pre-migration snapshot.
            "${compose[@]}" stop nginx
            "${compose[@]}" exec -T postgres sh -c 'pg_dump -Fc -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$backup"
            "${compose[@]}" exec -T postgres pg_restore --list < "$backup" > /dev/null
            "${compose[@]}" exec -T backend tar -C /var/www/html/storage -czf - . > "$backup.storage.tgz"
            tar -tzf "$backup.storage.tgz" > /dev/null
            baseline_sql='SELECT (SELECT count(*) FROM products), (SELECT count(*) FROM orders), (SELECT count(*) FROM order_items), (SELECT COALESCE(sum(total),0) FROM orders), (SELECT COALESCE(sum(stock_quantity),0) FROM inventories);'
            "${compose[@]}" exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c "$1"' sh "$baseline_sql" > "$backup.before"

            git fetch origin tag "$release_tag"
            git checkout --force "$release_tag"
            "${compose[@]}" build
            # NGINX stays stopped until schema and reconciliation checks pass.
            "${compose[@]}" up -d postgres backend frontend
            "${compose[@]}" exec -T backend tar -C /var/www/html/storage -xzf - < "$backup.storage.tgz"
            "${compose[@]}" exec -T backend chown -R www-data:www-data /var/www/html/storage
            "${compose[@]}" exec -T backend php artisan migrate --force
            "${compose[@]}" exec -T backend php artisan tenancy:verify
            "${compose[@]}" exec -T backend php artisan permission:cache-reset
            "${compose[@]}" exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c "$1"' sh "$baseline_sql" > "$backup.after"
            cmp "$backup.before" "$backup.after"
            "${compose[@]}" up -d nginx
            "${compose[@]}" ps
            git describe --tags --exact-match
          EOF
