name: bentadoor

services:

  postgres:
    image: postgres:16-alpine
    container_name: bentadoor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    
    ports:
      - "127.0.0.1:5434:5432"

    networks:
      - bentadoor-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: bentadoor-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Benta Door}

    volumes:
      - backend_storage:/var/www/html/storage

    expose:
      - "9000"

    networks:
      - bentadoor-network


  frontend:
    build:
      context: ./bentador
      dockerfile: Dockerfile

    container_name: bentadoor-frontend
    restart: unless-stopped

    expose:
      - "3000"

    networks:
      - bentadoor-network


  nginx:
    image: nginx:alpine

    container_name: bentadoor-nginx
    restart: unless-stopped

    depends_on:
      - frontend
      - backend

    expose:
      - "80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - bentadoor-network


networks:
  bentadoor-network:
    driver: bridge


volumes:
  backend_storage:
  postgres_data:
