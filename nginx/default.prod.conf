events {}

http {

    log_format edge_log
        '$remote_addr - $host [$time_local] '
        '"$request" $status $body_bytes_sent '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'upstream_response_time=$upstream_response_time '
        'request_time=$request_time';

    access_log /var/log/nginx/access.log edge_log;


    # ==========================================
    # Upstreams
    # ==========================================

    upstream trading_app {
        server trading-nginx:80;
    }

    upstream portfolio_app {
        server portfolio:80;
    }

    upstream bentador_app {
        server bentadoor-nginx:80;
    }


    # ==========================================
    # Trading HTTP → HTTPS
    # ==========================================

    server {

        listen 80;

        server_name
            trading-app.cyrusmanatad.com
            www.trading-app.cyrusmanatad.com;

        return 301 https://$host$request_uri;
    }


    # ==========================================
    # Portfolio HTTP → HTTPS
    # ==========================================

    server {

        listen 80;

        server_name portfolio.cyrusmanatad.com;

        return 301 https://$host$request_uri;
    }


    # ==========================================
    # Bentador HTTP → HTTPS
    # ==========================================

    server {

        listen 80;

        server_name bentador.cyrusmanatad.com;
        client_max_body_size 64m;

        return 301 https://$host$request_uri;
    }


    # ==========================================
    # Trading HTTPS
    # ==========================================

    server {

        listen 443 ssl;

        server_name
            trading-app.cyrusmanatad.com
            www.trading-app.cyrusmanatad.com;

        ssl_certificate
            /etc/nginx/ssl/cloudflare-origin.cert;

        ssl_certificate_key
            /etc/nginx/ssl/cloudflare-origin.key;

        ssl_protocols TLSv1.2 TLSv1.3;


        location / {

            proxy_pass http://trading_app;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto https;


            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection "upgrade";
        }
    }


    # ==========================================
    # Portfolio HTTPS
    # ==========================================

    server {

        listen 443 ssl;

        server_name portfolio.cyrusmanatad.com;

        ssl_certificate
            /etc/nginx/ssl/cloudflare-origin.cert;

        ssl_certificate_key
            /etc/nginx/ssl/cloudflare-origin.key;

        ssl_protocols TLSv1.2 TLSv1.3;


        location / {

            proxy_pass http://portfolio_app;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto https;
        }
    }


    # ==========================================
    # Bentador HTTPS
    # ==========================================

    server {

        listen 443 ssl;

        server_name bentador.cyrusmanatad.com;
        client_max_body_size 64m;

        ssl_certificate
            /etc/nginx/ssl/cloudflare-origin.cert;

        ssl_certificate_key
            /etc/nginx/ssl/cloudflare-origin.key;

        ssl_protocols TLSv1.2 TLSv1.3;


        location / {

            proxy_pass http://bentador_app;

            proxy_http_version 1.1;

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto https;
        }
    }


    # ==========================================
    # Default / Unknown Host
    # ==========================================

    server {

        listen 80 default_server;

        server_name _;

        return 444;
    }


    server {

        listen 443 ssl default_server;

        server_name _;

        ssl_certificate
            /etc/nginx/ssl/cloudflare-origin.cert;

        ssl_certificate_key
            /etc/nginx/ssl/cloudflare-origin.key;

        return 444;
    }
}
