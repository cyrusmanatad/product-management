name: bentador-tests
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bentador_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test -d bentador_test]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
  backend:
    user: '${TEST_UID:-1000}:${TEST_GID:-1000}'
    build:
      context: ./backend
      dockerfile: Dockerfile.test
      args:
        TEST_UID: ${TEST_UID:-1000}
        TEST_GID: ${TEST_GID:-1000}
    volumes:
      - ./backend:/app
      - test_vendor:/app/vendor
    tmpfs:
      - /app/storage:uid=${TEST_UID:-1000},gid=${TEST_GID:-1000},mode=0700
      - /app/bootstrap/cache:uid=${TEST_UID:-1000},gid=${TEST_GID:-1000},mode=0700
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: testing
      COMPOSER_HOME: /tmp/composer
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_DATABASE: bentador_test
      DB_USERNAME: test
      DB_PASSWORD: test
      CACHE_STORE: array
      SESSION_DRIVER: array
      JWT_SECRET: test-secret-for-isolation-suite-long-enough
    command: composer test

volumes:
  test_vendor:
